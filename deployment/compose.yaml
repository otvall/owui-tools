name: open-webui-local

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.1
    container_name: open-webui
    restart: always
    ports:
      - "3000:8080"
    environment:
      HF_HUB_OFFLINE: "1"
    volumes:
      - open-webui:/app/backend/data

volumes:
  open-webui:
    external: true
    name: open-webui
